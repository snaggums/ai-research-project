services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qual-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qual_ai
      POSTGRES_PASSWORD: qual_ai_dev
      POSTGRES_DB: qual_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qual_ai -d qual_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
